version: '3.8'

services:
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"

  fcm-worker-1:
    build: .
    container_name: worker1
    environment:
      - CONSUMER_NAME=inform_worker_1
    depends_on:
      - redis

  fcm-worker-2:
    build: .
    container_name: worker2
    environment:
      - CONSUMER_NAME=inform_worker_2
    depends_on:
      - redis

  fcm-worker-3:
    build: .
    container_name: worker3
    environment:
      - CONSUMER_NAME=inform_worker_3
    depends_on:
      - redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false  # 보안 비활성화 (로컬 테스트용)
      - ES_JAVA_OPTS=-Xms1g -Xmx1g    # 메모리 설정 (최소 4GB 권장)
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  es_data:
